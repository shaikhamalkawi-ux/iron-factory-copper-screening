name: Render manuscript figures
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render corrected figures
        run: |
          rsvg-convert -w 3600 figures/Figure1_target_aware_screening_four_fraction_sum.svg -o figures/Figure1_target_aware_screening_four_fraction_sum.png
          rsvg-convert -w 3600 figures/Figure2_Cu_retention_four_fraction_sum.svg -o figures/Figure2_Cu_retention_four_fraction_sum.png
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/Figure1_target_aware_screening_four_fraction_sum.png figures/Figure2_Cu_retention_four_fraction_sum.png
          git diff --cached --quiet || git commit -m "Render corrected manuscript figures"
          git push
